<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Immersion Solar System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud top-left">
      <div class="brand">AETHER / IMMERSION</div>
      <div class="status">Orbital AI Interface</div>
    </div>

    <div class="hud top-right">
      <div class="chip">8K Zoom</div>
      <div class="chip glow">Double Tap = Launch</div>
    </div>

    <div class="panel">
      <span class="eyebrow">AI Navigation</span>
      <h1>Solar System Immersion</h1>
      <p>
        Deep-space intelligence mode. Double-tap the viewport or press launch to
        drift from the outer galaxy into a cinematic orbital view.
      </p>
      <button id="launchButton">Launch</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
